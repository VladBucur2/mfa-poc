# /etc/nginx/sites-available/mfa-poc  (symlink into sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx)

# Per-IP rate limit for the authentication paths: the network half of SC-01.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;

server {
    listen 443 ssl;
    http2 on;
    server_name mfa-poc.lab;

    ssl_certificate     /etc/ssl/mfapoc/mfapoc.crt;
    ssl_certificate_key /etc/ssl/mfapoc/mfapoc.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location ~ ^/(login|mfa|enrol) {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Plaintext listener for test case 11 ONLY: it exists to show what an attacker sees
# without TLS. Enable it for that capture, then comment it out again.
server {
    listen 8081;
    server_name mfa-poc.lab;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
    }
}

server {
    listen 80;
    server_name mfa-poc.lab;
    return 301 https://$host$request_uri;
}
