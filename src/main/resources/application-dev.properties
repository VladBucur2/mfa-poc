# Quick local run with no infrastructure: mvn spring-boot:run -Dspring-boot.run.profiles=dev
server.address=0.0.0.0
server.servlet.session.cookie.secure=false

spring.datasource.url=jdbc:h2:mem:mfapoc;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Development key only. The lab and any demonstration run use POC_SECRET_KEY from the environment.
poc.secret-key=${POC_SECRET_KEY:ZGV2LWtleS1kby1ub3QtdXNlLWluLWFueS1kZW1vISE=}
