spring.application.name=mfa-poc

# Bind to loopback only: Nginx terminates TLS and proxies to this port.
server.port=8080
server.address=127.0.0.1

# Session cookie hardening (ASVS Session Management).
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# MySQL, mirroring the SecureDesk stack. Start it with: docker compose up -d
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/mfapoc?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=mfapoc
spring.datasource.password=${DB_PASSWORD:mfapoc}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 32 random bytes, base64. Generate with: openssl rand -base64 32
poc.secret-key=${POC_SECRET_KEY}
poc.issuer=MfaPoC

# Demonstration accounts. Override with environment variables before any assessment run.
poc.seed.requester-password=${POC_REQUESTER_PASSWORD:Requester-PoC-2026!}
poc.seed.admin-password=${POC_ADMIN_PASSWORD:Admin-PoC-2026!}
